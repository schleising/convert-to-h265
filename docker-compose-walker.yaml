version: "3.2"

services:
  walker-1:
    build: walker
    container_name: Walker-1
    hostname: Walker-1
    environment:
      - FOLDER_WALKER=TRUE
      - BACKEND_NAME=Walker-1
      - DB_URL=mongodb://macmini2.home.arpa:27017/
      - DB_NAME=media
      - DB_COLLECTION=media_collection
      - PUSH_COLLECTION=push_subscriptions
      # Cover-art prefetch (media-cover-art). Hybrid metadata-only: do not set
      # MEDIA_COVER_ART_CACHE_DIR. Keys: SONARR_API_KEY / RADARR_API_KEY /
      # TMDB_API_KEY from host env, or arr-keys.txt under ./src/secrets/
      # (mounted at /src/secrets/arr-keys.txt via ./src:/src:ro).
      - SONARR_URL=http://macmini2.home.arpa:8989
      - RADARR_URL=http://macmini2.home.arpa:7878
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    volumes:
      - ./src:/src:ro
      - /Volumes/My Book/Media/:/Media:rw
    restart: unless-stopped
    extra_hosts:
        - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
