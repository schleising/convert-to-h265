# Legacy / laptop-oriented compose. Prefer docker-compose.yaml for Mac Mini + X10.
# Same layout rule: library, Backup, and Conversions all under /Media (no converter_volume).
services:
  backend-1:
    build: backend
    container_name: MBP-1
    hostname: MBP-1
    # Match host media ownership if mounts are mode 0700 (e.g. PUID=501 PGID=20 on macOS).
    user: "${PUID:-501}:${PGID:-20}"
    environment:
      - FOLDER_WALKER=FALSE
      - BACKEND_NAME=MBP-1
      - DB_URL=mongodb://host.docker.internal:27017
      - DB_NAME=media
      - DB_COLLECTION=media_collection
      - PUSH_COLLECTION=push_subscriptions
    volumes:
      - ./src:/src:ro
      - /Volumes/X10/Media:/Media:rw
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
